name: Build Farhang Signed APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q Farhang_CodeLookup_ReadyToBuild.zip -d extracted
          test -f extracted/farhang/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os
          import base64
          import re
          import sys

          value = os.environ.get("KEYSTORE_BASE64", "")
          value = re.sub(r"\s+", "", value)

          print("Secret present:", bool(value))
          print("Encoded length:", len(value))
          print("Length remainder:", len(value) % 4)
          print("Invalid characters:", len(re.sub(r"[A-Za-z0-9+/=]", "", value)))

          try:
              data = base64.b64decode(value, validate=True)
              if not data:
                  raise ValueError("Decoded data is empty")
              with open("extracted/farhang/farhang-release-key.jks", "wb") as f:
                  f.write(data)
              print("Base64 validation: passed")
              print("Decoded file size:", len(data))
          except Exception as e:
              print("Base64 validation: failed")
              print("Error type:", type(e).__name__)
              sys.exit(1)
          PY

      - name: Configure release signing
        working-directory: extracted/farhang
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()
          needle = "android {\n"

          insert = '''android {
              signingConfigs {
                  create("release") {
                      storeFile = file("../farhang-release-key.jks")
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("KEY_ALIAS")
                      keyPassword = System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          '''

          if s.count(needle) != 1:
              raise SystemExit("Could not safely locate android block")

          p.write_text(s.replace(needle, insert, 1))
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed release APK
        working-directory: extracted/farhang
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Farhang-CodeLookup-Release-Signed
          path: extracted/farhang/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
```
